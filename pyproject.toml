[build-system]
# mlcflow used to be a build requirement so setup.py could `import mlc` for
# the post-install clone. That hook is gone, so the build no longer needs it.
requires = ["setuptools>=61.0", "wheel", "toml"]
build-backend = "setuptools.build_meta"

[project]
name = "mlc-scripts"
dynamic = ["version"]
description = "Automation scripts for running ML applications using MLC interface"
authors = [
    { name = "MLCommons", email = "systems@mlcommons.org" }
]
license = { file = "LICENSE.md" }
readme = "README.md"
requires-python = ">=3.7"
keywords = ["mlc", "mlcscripts", "mlcflow", "pypi", "package", "automation", "mlperf", "mlcr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests",
    "pyyaml",
    # 1.4.0 is the first release that discovers the packaged script content
    # from the running interpreter. Older mlcflow expects the post-install
    # git clone that no longer happens, and would find no scripts at all.
    #
    # Pinned to the 1.4.0 alpha rather than >=1.4.0 because PEP 440 sorts a
    # prerelease *before* its final: 1.4.0a1 does not satisfy >=1.4.0, so
    # that form would refuse the very build this is being tested against.
    # Naming a prerelease in the specifier is also what allows pip to
    # consider prereleases for it at all. Tighten to >=1.4.0 once mlcflow
    # 1.4.0 final is on PyPI.
    "mlcflow>=1.4.0a1",
    "giturlparse"
]

[project.urls]
Homepage = "https://github.com/mlcommons/mlperf-automations"
Documentation = "https://docs.mlcommons.org/mlperf-automations"
Repository = "https://github.com/mlcommons/mlperf-automations"
Issues = "https://github.com/mlcommons/mlperf-automations/issues"

[tool.setuptools]
# packages are declared in setup.py, which also assembles the mlc_scripts
# payload at build time.
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
"mlcr" = ["README.md", "VERSION", "git_commit_hash.txt"]
