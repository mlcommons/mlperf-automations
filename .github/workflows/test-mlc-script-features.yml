name: MLC script content features test

# The automation *engine* moved to mlcflow (see automation/README.md), and with
# it the engine-facing jobs that used to live in this workflow:
#   - test_experiment      -> mlcflow/.github/workflows/test-mlc-script-features.yml
#   - test_error_handling  -> same
#   - the process_mounts unit test in test_docker -> same
# What remains here exercises script *content* in this repo.

on:
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/test-mlc-script-features.yml'
      - 'script/detect-os/**'
      - 'script/detect-cpu/**'
      - 'script/get-generic-python-lib/**'
      - 'script/run-docker-container/**'
      - 'script/download-file/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test_mlc_script_features:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Configure git longpaths (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        git config --system core.longpaths true
    - name: Pull MLOps repository
      shell: bash
      env:
        REPO: ${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
        BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      run: |
        pip install mlcflow
        mlc pull repo "$REPO" --branch="$BRANCH"

    - name: Test Python venv
      run: |
        mlcr install,python-venv --name=test --quiet
        mlc search cache --tags=get,python,virtual,name-test --quiet

    - name: Test variations
      run: |
        mlcr get,dataset,preprocessed,imagenet,_NHWC --quiet
        mlc search cache --tags=get,dataset,preprocessed,imagenet,-_NCHW
        mlc search cache --tags=get,dataset,preprocessed,imagenet,-_NHWC

    - name: Test native script name variants
      run: |
        mlcr get,wkhtmltopdf --quiet

    - name: Test versions
      if: runner.os == 'Linux'
      run: |
        mlcr get,generic-python-lib,_package.scipy --version=1.11.4 --quiet
        test $? -eq 0 || exit $?
        mlcr get,generic-python-lib,_package.scipy --version=1.11.3 --quiet
        test $? -eq 0 || exit $?
        mlc find cache --tags=get,generic-python-lib,_package.scipy,version-1.11.3
        test $? -eq 0 || exit $?

    - name: Test python install from src
      run: |
        mlcr python,src,install,_shared --version=3.9.10 --quiet
        mlc search cache --tags=python,src,install,_shared,version-3.9.10

  test_docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Pull MLOps repository
      shell: bash
      env:
        REPO: ${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
        BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      run: |
        pip install mlcflow
        mlc pull repo "$REPO" --branch="$BRANCH"

    - name: Run docker container from dockerhub on linux
      run: |
        mlcr run,docker,container --adr.compiler.tags=gcc --docker_mlc_repo=mlcommons@mlperf-automations --docker_mlc_repo_branch=dev --image_name=cm-script-app-image-classification-onnx-py --env.MLC_DOCKER_RUN_SCRIPT_TAGS=app,image-classification,onnx,python --env.MLC_DOCKER_IMAGE_BASE=ubuntu:22.04 --env.MLC_DOCKER_IMAGE_REPO=cknowledge --quiet

    - name: Run docker container locally on linux
      run: |
        mlcr run,docker,container --adr.compiler.tags=gcc --docker_mlc_repo=mlcommons@mlperf-automations --docker_mlc_repo_branch=dev --image_name=mlc-script-app-image-classification-onnx-py --env.MLC_DOCKER_RUN_SCRIPT_TAGS=app,image-classification,onnx,python --env.MLC_DOCKER_IMAGE_BASE=ubuntu:22.04 --env.MLC_DOCKER_IMAGE_REPO=local --quiet

    - name: Test nested Docker opt-in mount handling
      shell: bash
      run: |
        python - <<'PY'
        import importlib.util
        import os
        import sys
        from types import SimpleNamespace
        from unittest.mock import patch

        # run-docker-container/customize.py does `from utils import ...`, which
        # now resolves against the automation/ directory bundled with mlcflow,
        # since this repo no longer ships one. Resolve it the same way mlcflow
        # does rather than assuming a path.
        from mlc.action import Action

        engine_script_dir = Action().bundled_automation_path('script')
        assert engine_script_dir, \
            "bundled automation/script not found - mlcflow too old?"
        sys.path.insert(0, os.path.dirname(engine_script_dir))

        spec = importlib.util.spec_from_file_location(
            'run_docker_customize',
            'script/run-docker-container/customize.py'
        )
        mod = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(mod)

        logger_messages = []
        logger = SimpleNamespace(
            info=lambda *args, **kwargs: logger_messages.append(('info', args)),
            error=lambda *args, **kwargs: logger_messages.append(('error', args))
        )
        DOCKER_ENV_MARKER = '/.dockerenv'
        DOCKER_SOCKET = '/var/run/docker.sock'
        DOCKER_BIN = '/usr/bin/docker'

        def run_case(enable_nested, docker_exit_code=0):
            captured = {'cmd': ''}

            def fake_system(cmd):
                captured['cmd'] = cmd
                return docker_exit_code

            def fake_exists(path):
                if path in [DOCKER_ENV_MARKER, DOCKER_SOCKET, DOCKER_BIN]:
                    return True
                return False

            env = {
                'MLC_CONTAINER_TOOL': 'docker',
                'MLC_DOCKER_RUN_SCRIPT_TAGS': 'run,docker,container',
                'MLC_DOCKER_RUN_CMD': 'echo nested-docker-ci-check',
                'MLC_DOCKER_ENABLE_NESTED': 'yes' if enable_nested else 'no'
            }
            i = {
                'os_info': {'platform': 'linux'},
                'env': env,
                'automation': SimpleNamespace(logger=logger)
            }

            with patch.object(mod.os.path, 'exists', side_effect=fake_exists), \
                    patch.object(mod.os, 'system', side_effect=fake_system), \
                    patch.object(mod.shutil, 'which', return_value=DOCKER_BIN):
                result = mod.postprocess(i)

            return result, captured['cmd']

        enabled_result, enabled_cmd = run_case(True, docker_exit_code=0)
        disabled_result, disabled_cmd = run_case(False, docker_exit_code=0)
        failed_result, _ = run_case(True, docker_exit_code=1)

        assert enabled_result['return'] == 0, enabled_result
        assert disabled_result['return'] == 0, disabled_result
        error_msg = failed_result.get('error', '').lower()
        assert failed_result['return'] == 1, failed_result
        assert 'docker' in error_msg, failed_result
        assert 'failed' in error_msg, failed_result

        assert f'{DOCKER_SOCKET}:{DOCKER_SOCKET}' in enabled_cmd, enabled_cmd
        assert f'{DOCKER_BIN}:{DOCKER_BIN}' in enabled_cmd, enabled_cmd
        assert f'{DOCKER_SOCKET}:{DOCKER_SOCKET}' not in disabled_cmd, disabled_cmd
        assert f'{DOCKER_BIN}:{DOCKER_BIN}' not in disabled_cmd, disabled_cmd
        print('Nested Docker opt-in mount handling test passed')
        PY
