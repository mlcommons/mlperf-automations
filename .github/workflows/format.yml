# Automatic code formatting
name: "Code formatting"
on:
  push:
    branches:
      - "**"

env:
  python_version: "3.9"

jobs:
  format-code:
    if: github.actor != 'mlc-automations[bot]' && github.repository_owner == 'mlcommons'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MLC_AUTOMATIONS_APP_ID }}
          private-key: ${{ secrets.MLC_AUTOMATIONS_PRIVATE_KEY }}

      - name: Resolve the App's bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          slug: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # GitHub links a noreply address by the numeric id inside it and ignores
          # the name, so the App's bot user id has to be looked up, not written down.
          id=$(gh api "/users/${slug}%5Bbot%5D" --jq .id)
          echo "name=${slug}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${slug}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python ${{ env.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_version }}

      - name: Lint MLC metas
        run: |
          pip install mlcflow
          mlc lint script --all
          git add -- '*/meta.yaml' '*/meta.yml' 2>/dev/null || true

      - name: Format modified Python files
        env:
          filter: ${{ github.event.before }}
        run: |
          python3 -m pip install autopep8
          for FILE in $(git diff --name-only $filter | grep -E '.*\.py$')
          do
            # Check if the file still exists in the working tree
            if [ -f "$FILE" ]; then
              autopep8 --in-place -a "$FILE"
              git add "$FILE"
            fi
          done

      - name: Format modified C++ files
        env:
          filter: ${{ github.event.before }}
        run: |
          for FILE in $(git diff --name-only $filter | grep -E '.*\.(cc|cpp|h|hpp)$')
          do
            # Check if the file still exists in the working tree
            if [ -f "$FILE" ]; then
              clang-format -i -style=file $FILE
              git add $FILE
            fi
          done

      - name: Commit and push changes
        run: |
          HAS_CHANGES=$(git diff --staged --name-only)
          if [ ${#HAS_CHANGES} -gt 0 ]; then
            git config --global user.name "${{ steps.bot.outputs.name }}"
            git config --global user.email "${{ steps.bot.outputs.email }}"
            # Commit changes
            git commit -m '[Automated Commit] Format Codebase'
            git push 
          fi
