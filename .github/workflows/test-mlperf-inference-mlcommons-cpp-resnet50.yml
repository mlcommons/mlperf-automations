name: MLPerf inference MLCommons C++ ResNet50

on:
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/test-mlperf-inference-mlcommons-cpp-resnet50.yml'
      - 'script/run-mlperf-inference-app/**'
      - 'script/app-mlperf-inference/**'
      - 'script/app-mlperf-inference-mlcommons-cpp/**'
      - 'script/get-ml-model-resnet50/**'
      - 'script/get-mlperf-inference-src/**'
      - 'script/get-mlperf-inference-loadgen/**'
      - 'script/get-mlperf-inference-sut-description/**'
      - 'script/get-mlperf-inference-results-dir/**'
      - 'script/benchmark-any-mlperf-inference-implementation/**'
      - 'script/generate-mlperf-inference-user-conf/**'
      - 'script/get-git-repo/**'
      - 'script/get-generic-python-lib/**'
      - 'script/get-gcc/**'
      - 'script/get-llvm/**'
      - 'script/get-generic-sys-util/**'
      - 'script/get-cache-dir/**'
      - 'script/detect-sudo/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

jobs:     
  run-mlperf-inference-resnet50-cpp:
    name: MLPerf inference MLCommons C++ ResNet50
    if: github.repository_owner == 'mlcommons'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12" ]
        compiler-string: [ "--adr.compiler.tags=gcc", "--adr.compiler.tags=aocc --env.MLC_AOCC_ACCEPT_EULA=yes", "--adr.compiler.tags=llvm --adr.compiler.version=17.0.6" ]
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          - os: windows-latest
          - os: macos-latest
            compiler-string: --adr.compiler.tags=gcc
          - os: macos-latest
            compiler-string: --adr.compiler.tags=aocc --env.MLC_AOCC_ACCEPT_EULA=yes

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install mlcflow
      run: |
        pip install mlcflow
    - name: Pull MLOps repository
      env:
        REPO: ${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
        BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      run: |
        mlc pull repo "$REPO" --branch="$BRANCH"
        mlcr --quiet --tags=get,sys-utils-mlc
    - name: Test MLPerf Inference MLCommons C++ ResNet50 on ${{ matrix.os }}
      if: matrix.os == 'windows-latest'
      run: |
        mlcr app,mlperf,inference,mlcommons,cpp --submitter="MLCommons" --hw_name=gh_${{ matrix.os }} --adr.loadgen.tags=_from-pip --pip_loadgen=yes -v --quiet
    - name: Test MLPerf Inference MLCommons C++ ResNet50 on ${{ matrix.os }}
      if: matrix.os != 'windows-latest'
      run: |
        mlcr app,mlperf,inference,mlcommons,cpp --submitter="MLCommons" --hw_name=gh_${{ matrix.os }} -v --quiet ${{ matrix.compiler-string }}
