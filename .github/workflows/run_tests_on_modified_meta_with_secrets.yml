name: Test script on modified meta (with secret)

on:
  pull_request_target:
    branches: [ "main" ]
    paths:
      - 'script/**meta.yaml'

jobs:
  get_modified_files:
    runs-on: ubuntu-latest
    outputs:
      processed_files: ${{ steps.modified-files.outputs.processed_files }}

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install pyyaml

    - name: Fetch PR head
      run: |
        git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head 
    
    - name: Get changed files
      id: modified-files
      run: |
        git fetch origin ${{ github.event.pull_request.base.ref }}
        changed_files=$(git diff origin/${{ github.event.pull_request.base.ref }}...pr-head --name-only | paste -sd, -)
        echo "$changed_files" | python3 .github/scripts/list_modified_scripts_with_secrets.py

  process_modified_files:
    needs: 
      - get_modified_files
    runs-on: ubuntu-latest
    if: needs.get_modified_files.outputs.processed_files != '[]' && needs.get_modified_files.outputs.processed_files != ''
    strategy:
      fail-fast: false
      matrix:
        file_info: ${{ fromJSON(needs.get_modified_files.outputs.processed_files).file_info }}
    steps:
      - name: Load secrets
        id: op-load-secrets
        uses: 1password/load-secrets-action@v3
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_KEY: op://7basd2jirojjckncf6qnq3azai/bzbaco3uxoqs2rcyu42rvuccga/credential
          CF_ACCESS_CLIENT_ID: "op://7basd2jirojjckncf6qnq3azai/pnmuaflgk6knqycozwrxmixdcu/qcqdvhbacunfh6kczsj7ij7uy4"
          CF_ACCESS_CLIENT_SECRET: "op://7basd2jirojjckncf6qnq3azai/pnmuaflgk6knqycozwrxmixdcu/5qk7gaxyr3tmwqktyp4yiyjyeu"
  
      - name: Set RCLONE Service account env var from secret
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ steps.op-load-secrets.outputs.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: |
          # rclone matches a remote to its RCLONE_CONFIG_<remote>_<option>
          # override using the remote's exact name and does not translate "-"
          # to "_", so RCLONE_CONFIG_MLC_COGNATA_* never reached the
          # "mlc-cognata" remote and rclone fell back to interactive OAuth.
          # The backend-wide variable applies to every drive remote
          # (mlc-cognata, mlc-llama2, mlc_waymo, ...) and avoids the name
          # mapping entirely. Non-drive remotes such as the mlc-inference S3
          # config are unaffected.
          {
            echo "RCLONE_DRIVE_SERVICE_ACCOUNT_CREDENTIALS<<MLC_EOF_SA"
            echo "$GDRIVE_SERVICE_ACCOUNT_KEY"
            echo "MLC_EOF_SA"
          } >> "$GITHUB_ENV"

      - name: Set r2-downloader Service account env var from secret
        shell: bash
        run: |
          echo "CF_ACCESS_CLIENT_ID=${{ steps.op-load-secrets.outputs.CF_ACCESS_CLIENT_ID }}" >> $GITHUB_ENV
          echo "CF_ACCESS_CLIENT_SECRET=${{ steps.op-load-secrets.outputs.CF_ACCESS_CLIENT_SECRET }}" >> $GITHUB_ENV
        
      - name: Process meta.yaml file
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.html_url }}
        run: |
          echo "Processing ${{ matrix.file_info.file }} (run #${{ matrix.file_info.num_run }})"
          pip install mlcflow
          mlc pull repo "$HEAD_REPO_URL" --branch="$HEAD_REF"
          mlc test script ${{ matrix.file_info.uid }} --test_input_index=${{ matrix.file_info.num_run }} --docker_mlc_repo="$HEAD_REPO_URL" --docker_mlc_repo_branch="$HEAD_REF" --quiet
