name: MLPerf inference ResNet50

permissions:
  contents: read

on:
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/test-mlperf-inference-resnet50.yml'
      - 'automation/script/**'
      - 'script/run-mlperf-inference-app/**'
      - 'script/app-mlperf-inference/**'
      - 'script/app-mlperf-inference-mlcommons-python/**'
      - 'script/get-ml-model-resnet50/**'
      - 'script/get-mlperf-inference-src/**'
      - 'script/get-mlperf-inference-utils/**'
      - 'script/get-mlperf-inference-loadgen/**'
      - 'script/get-mlperf-inference-sut-description/**'
      - 'script/get-mlperf-inference-results-dir/**'
      - 'script/benchmark-any-mlperf-inference-implementation/**'
      - 'script/generate-mlperf-inference-user-conf/**'
      - 'script/pull-git-repo/**'
      - 'script/get-git-repo/**'
      - 'script/get-generic-python-lib/**'
      - 'script/get-gcc/**'
      - 'script/get-llvm/**'
      - 'script/get-generic-sys-util/**'
      - 'script/get-cache-dir/**'
      - 'script/detect-sudo/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: {}

jobs:
  mlc-run:
    runs-on: ${{ matrix.os }}
    env:
      MLC_INDEX: "on"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [ "3.13" ]
        backend: [ "onnxruntime", "tf" ]
        implementation: [ "python", "cpp" ]
        exclude:
          - backend: tf
            implementation: cpp
          - os: macos-latest
            backend: tf
          - os: windows-latest
            implementation: cpp
  
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Configure git longpaths (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        git config --system core.longpaths true

    - name: Install mlcflow
      run: |
        pip install mlcflow
        pip install tabulate

    - name: Pull MLOps repo
      shell: bash
      env:
        REPO: ${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
        BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      run: |
        mlc pull repo "$REPO" --branch="$BRANCH"

    - name: Test MLPerf Inference ResNet50 (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mlcr run-mlperf,inference,_submission,_short,_r6.0-dev --submitter="MLCommons" --pull_changes=yes --pull_inference_changes=yes --hw_name="gh_${{ matrix.os }} x86" --model=resnet50 --adr.loadgen.tags=_from-pip --pip_loadgen=yes --implementation=${{ matrix.implementation }} --backend=${{ matrix.backend }} --device=cpu --scenario=Offline --test_query_count=500 --target_qps=1 -v --quiet 
    - name: Test MLPerf Inference ResNet50 (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        mlcr run-mlperf,inference,_submission,_short,_r6.0-dev --submitter="MLCommons" --pull_changes=yes --pull_inference_changes=yes --hw_name="gh_${{ matrix.os }} x86" --model=resnet50 --implementation=${{ matrix.implementation }} --backend=${{ matrix.backend }} --device=cpu --scenario=Offline --test_query_count=500 --target_qps=1 -v --quiet     

  mlc-run-rhel-docker:
    runs-on: ubuntu-latest
    env:
      MLC_INDEX: "on"
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install mlcflow
      run: |
        pip install mlcflow
        pip install tabulate
    - name: Pull MLOps repo
      shell: bash
      env:
        REPO: ${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}
        BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      run: |
        mlc pull repo "$REPO" --branch="$BRANCH"
    - name: Test MLPerf Inference ResNet50 (RHEL Docker)
      run: |
        mlcd run-mlperf,inference,_submission,_short,_r6.0-dev \
          --submitter="MLCommons" \
          --pull_changes=yes \
          --pull_inference_changes=yes \
          --hw_name="gh_rhel9_docker x86" \
          --model=resnet50 \
          --implementation=python \
          --backend=onnxruntime \
          --device=cpu \
          --scenario=Offline \
          --test_query_count=500 \
          --target_qps=1 \
          --docker_dt \
          --docker_os=rhel \
          --docker_os_version=9 \
          -v --quiet
   
