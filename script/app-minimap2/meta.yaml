alias: app-minimap2
uid: c9ba09523c9ca35a
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application
tags:
- app
- minimap2
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_MINIMAP2_SRC_PATH
- MLC_MINIMAP2_INSTALL_PATH
- MLC_MINIMAP2_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- tags: get,generic-sys-util,_zlib1g-dev
- tags: get,git,repo
  names:
  - minimap2-repo
  extra_cache_tags: minimap2,repo,minimap2-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_MINIMAP2_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://github.com/lh3/minimap2.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  version.2.28:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT_TAG: v2.28
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'

# Tests
tests:
  run_inputs:
  - variations_list:
    - repo.official
