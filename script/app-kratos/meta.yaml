alias: app-kratos
uid: 609622db13ca57d2
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application

tags:
- app
- kratos
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_KRATOS_SRC_PATH
- MLC_KRATOS_INSTALL_PATH
- MLC_KRATOS_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,generic-sys-util,_cmake
- tags: get,generic-sys-util,_libboost-all-dev
- tags: get,generic-sys-util,_python3-dev
- tags: get,python3
  names:
  - python
  - python3
- tags: get,git,repo
  names:
  - kratos-repo
  extra_cache_tags: kratos,repo,kratos-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_KRATOS_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://github.com/KratosMultiphysics/Kratos.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.10.4.3:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT_TAG: v10.4.3

# Tests
tests:
  run_inputs:
  - variations_list:
    - repo.official
