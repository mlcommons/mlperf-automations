alias: app-gadget4
uid: e17678915fa41f47
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application
tags:
- app
- gadget4
- gadget
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_GADGET4_SRC_PATH
- MLC_GADGET4_INSTALL_PATH
- MLC_GADGET4_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,generic-sys-util,_libopenmpi-dev
- tags: get,generic-sys-util,_libgsl-dev
- tags: get,generic-sys-util,_libhdf5-dev
- tags: get,generic-sys-util,_libfftw3-dev
- tags: get,python3
  names:
  - python
  - python3
- tags: get,git,repo
  names:
  - gadget4-repo
  extra_cache_tags: gadget4,repo,gadget4-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_GADGET4_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://gitlab.mpcdf.mpg.de/vrs/gadget4.git
    group: repo
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.master:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT: master

# Tests
# Builds against apt-installed GSL/HDF5/FFTW/MPI on the CI runner. Not validated
# on the offline dev host (no libgsl-dev / no sudo); relies on CI for validation.
tests:
  run_inputs:
  - variations_list:
    - repo.official
