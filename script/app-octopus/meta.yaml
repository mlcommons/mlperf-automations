alias: app-octopus
uid: 6238544d0c1129c1
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application
tags:
- app
- octopus
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_OCTOPUS_SRC_PATH
- MLC_OCTOPUS_INSTALL_PATH
- MLC_OCTOPUS_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,generic-sys-util,_liblapack-dev
- tags: get,generic-sys-util,_libxc-dev
- tags: get,generic-sys-util,_libopenmpi-dev
- tags: get,generic-sys-util,_automake
- tags: get,generic-sys-util,_libtool
- tags: get,generic-sys-util,_m4
- tags: get,generic-sys-util,_gfortran
- tags: get,generic-sys-util,_libgsl-dev
- tags: get,generic-sys-util,_libfftw3-dev
- tags: get,generic-sys-util,_autoconf
- tags: get,git,repo
  names:
  - octopus-repo
  extra_cache_tags: octopus,repo,octopus-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_OCTOPUS_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://gitlab.com/octopus-code/octopus.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.release-2-0-1:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT_TAG: release-2-0-1

# Tests
# Empty: heavy dependency stack / long build; recipe provided in run.sh
# but not enabled in CI. Validate and enable once confirmed.
tests:
  run_inputs: []
