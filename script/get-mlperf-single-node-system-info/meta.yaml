alias: get-mlperf-single-node-system-info
uid: fe91d73029c94ec1
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: Platform information
tags:
- get
- mlperf
- single-node
- system-info

# Cache
cache: false

# Environment
new_env_keys:
- MLC_SINGLE_NODE_SYSTEM_INFO_FILE_PATH
- MLC_SINGLE_NODE_SYSTEM_INFO_DIR_PATH
- MLC_SINGLE_NODE_SYSTEM_INFO_FILE_NAME
- MLC_SINGLE_NODE_LSTOPO_XML_FILE_PATH
- MLC_SINGLE_NODE_LSTOPO_XML_FILE_NAME

# Input mapping
input_mapping:
  node_id: MLC_SINGLE_NODE_SYSTEM_ID
  out_dir_path: MLC_SINGLE_NODE_SYSTEM_INFO_DIR_PATH
  out_file_name: MLC_SINGLE_NODE_SYSTEM_INFO_FILE_NAME

# Dependencies
deps:
- tags: detect,os
- tags: detect,cpu
- tags: get,cuda-devices
  enable_if_env:
    MLC_ACCELERATOR_BACKEND:
    - cuda
  skip_if_env:
    MLC_HOST_OS_TYPE:
    - windows
- tags: get,rocm-devices
  enable_if_env:
    MLC_ACCELERATOR_BACKEND:
    - rocm
  skip_if_env:
    MLC_HOST_OS_TYPE:
    - windows
- tags: get,xpu-devices
  enable_if_env:
    MLC_ACCELERATOR_BACKEND:
    - xpu
  skip_if_env:
    MLC_HOST_OS_TYPE:
    - windows
- tags: detect,sudo
- tags: get,python
  names:
  - python
  - python3
- tags: get,platform-details
  names:
  - platform-details
- tags: detect,host,system,details

# The lstopo capture has to sit next to the sysinfo JSON, and that path is only
# resolved in preprocess(), so this is a prehook dep rather than a plain dep.
prehook_deps:
- tags: get,lstopo
  names:
  - lstopo
  enable_if_env:
    MLC_COLLECT_LSTOPO_TOPOLOGY:
    - 'True'
  env:
    MLC_LSTOPO_OUT_DIR_PATH: <<<MLC_SINGLE_NODE_SYSTEM_INFO_DIR_PATH>>>
    MLC_LSTOPO_OUT_FILE_NAME: <<<MLC_SINGLE_NODE_LSTOPO_XML_FILE_NAME>>>

# Variations
variations:
  # Capture this node's hwloc topology alongside the sysinfo JSON. Used by
  # get-mlperf-multi-node-system-info,_infragraph, which needs one lstopo XML
  # per node to build the infrastructure graph -- collecting it here means the
  # existing sysinfo fan-out carries the topology back too, with no second SSH
  # pass.
  lstopo:
    env:
      MLC_COLLECT_LSTOPO_TOPOLOGY: 'True'
  cuda:
    group: accelerator-backend
    env:
      MLC_ACCELERATOR_BACKEND: cuda
    adr:
      platform-details:
        tags: _cuda
  rocm:
    group: accelerator-backend
    env:
      MLC_ACCELERATOR_BACKEND: rocm
  xpu:
    group: accelerator-backend
    env:
      MLC_ACCELERATOR_BACKEND: xpu
