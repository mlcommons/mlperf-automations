alias: app-sherpa
uid: 157fb00923c06aab
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application

tags:
- app
- sherpa
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_SHERPA_SRC_PATH
- MLC_SHERPA_INSTALL_PATH
- MLC_SHERPA_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,generic-sys-util,_cmake
- tags: get,generic-sys-util,_gfortran
- tags: get,generic-sys-util,_pkg-config
- tags: get,generic-sys-util,_libsqlite3-dev
- tags: get,generic-sys-util,_zlib1g-dev
- tags: get,python3
  names:
  - python
  - python3
- tags: get,git,repo
  names:
  - sherpa-repo
  extra_cache_tags: sherpa,repo,sherpa-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_SHERPA_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://gitlab.com/sherpa-team/sherpa.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.3.0.5:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT_TAG: v3.0.5

# Tests
tests:
  run_inputs:
  - variations_list:
    - repo.official
