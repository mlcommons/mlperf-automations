alias: get-rocm-devices
uid: c618239543364753
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: ROCM automation
tags:
- get
- rocm-devices

# Cache
cache: false
can_force_cache: true
clean_files:
- tmp-run.out

# Environment
new_env_keys:
- MLC_ROCM_*
# Without these the per-device records stay inside this script: MLC only
# hands a dependency's state to its caller for the keys named here, so
# get-mlperf-single-node-system-info saw no accelerator at all on an AMD
# host. get-cuda-devices and get-xpu-devices have always declared theirs.
new_state_keys:
- mlc_rocm_device_prop
- mlc_rocm_devices_prop
- mlc_rocm_num_devices

# Dependencies
deps:
- tags: get,python
- tags: get,generic-python-lib,_package.hip-python
  env:
    MLC_GENERIC_PYTHON_PIP_EXTRA_INDEX_URL: https://test.pypi.org/simple

# Docker / container
docker:
  run: false
  all_gpus: 'yes'
  skip_run_cmd: 'no'
  skip_mlc_sys_upgrade: 'yes'
  mlc_repo_flags: --checkout=dev
  use_host_group_id: 'yes'
  image_tag_extra: -cm-dev

# Output / debugging
print_files_if_script_error:
- tmp-run.out
