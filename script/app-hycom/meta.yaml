alias: app-hycom
uid: 0c0098d4fd629abb
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application

tags:
- app
- hycom
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_HYCOM_SRC_PATH
- MLC_HYCOM_INSTALL_PATH
- MLC_HYCOM_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,generic-sys-util,_gfortran
- tags: get,generic-sys-util,_libnetcdf-dev
- tags: get,generic-sys-util,_libnetcdff-dev
- tags: get,generic-sys-util,_libopenmpi-dev
- tags: get,git,repo
  names:
  - hycom-repo
  extra_cache_tags: hycom,repo,hycom-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_HYCOM_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://github.com/HYCOM/HYCOM-src.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.2.3.01:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT_TAG: 2.3.01

# Tests
tests:
  run_inputs: []
