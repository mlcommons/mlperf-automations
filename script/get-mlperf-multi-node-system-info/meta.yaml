alias: get-mlperf-multi-node-system-info
uid: 1e4bc0644f554bc2
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: Platform information
tags:
- get-mlperf-multi-node-system-info

# Cache
cache: false

# Environment
new_env_keys:
- MLC_REMOTE_RUN_SSH_ID_COUNT
- MLC_MULTI_NODE_SYSTEM_INFO_FILE_PATH
- MLC_NAMEPLATE_POWER_YAML_FILE_PATH
# Produced by the generate-infograph post dep under _infragraph; re-exported
# here so callers of this script see the graph paths too.
- MLC_INFRAGRAPH_*

# Input mapping
input_mapping:
  config_file: MLC_MLPERF_CONFIG_FILE
  category: MLC_MLPERF_SUBMISSION_SYSTEM_TYPE
  cooling: MLC_MLPERF_COOLING
  dataset_id: MLC_MLPERF_DATASET_ID
  dataset_name: MLC_MLPERF_DATASET_NAME
  dataset_type: MLC_MLPERF_DATASET_TYPE
  division: MLC_MLPERF_SUBMISSION_DIVISION
  hw_notes: MLC_MLPERF_HARDWARE_NOTES
  input_token_average: MLC_MLPERF_DATASET_INPUT_TOKEN_AVERAGE
  link_to_dataset: MLC_MLPERF_DATASET_LINK
  link_to_model: MLC_MLPERF_MODEL_LINK
  link_to_model_transformation: MLC_MLPERF_MODEL_TRANSFORMATION_LINK
  model_id: MLC_MLPERF_MODEL_ID
  model_name: MLC_MLPERF_MODEL
  model_notes: MLC_MLPERF_MODEL_NOTES
  model_precision: MLC_MLPERF_MODEL_PRECISION
  other_hardware: MLC_MLPERF_OTHER_HARDWARE
  out_dir_path: MLC_MULTI_NODE_SYSTEM_INFO_DIR_PATH
  out_file_name: MLC_MULTI_NODE_SYSTEM_INFO_FILE_NAME
  output_token_average: MLC_MLPERF_DATASET_OUTPUT_TOKEN_AVERAGE
  skip_ssh_key_file: MLC_SKIP_SSH_KEY_FILE
  ssh_ids: MLC_MULTINODE_SYSTEM_SSH_IDS
  system_availability_status: MLC_MLPERF_SUBMISSION_SYSTEM_STATUS
  submitter_contact: MLC_MLPERF_SUBMITTER_CONTACT
  submitter_org_name: MLC_MLPERF_SUBMITTER
  node_config_file: MLC_NODE_CONFIG_FILE
  system_name: MLC_MLPERF_SYSTEM_NAME
  container_link: MLC_MLPERF_CONTAINER_LINK
  measured_accuracy_score: MLC_MLPERF_MEASURED_ACCURACY_SCORE
  system_node_ensemble_count: MLC_MLPERF_SYSTEM_NODE_ENSEMBLE_COUNT
  system_node_ensemble_total: MLC_MLPERF_SYSTEM_NODE_ENSEMBLE_TOTAL
  system_size: MLC_MLPERF_SYSTEM_SIZE
  serving_framework: MLC_MLPERF_SERVING_FRAMEWORK
  endpoint_url: MLC_MLPERF_ENDPOINT_URL
  serving_node: MLC_MLPERF_SERVING_NODE
  log_path: MLC_MLPERF_SERVING_LOG_PATH
  run_metadata_path: MLC_MLPERF_RUN_METADATA_PATH
  serving_framework_type: MLC_MLPERF_SERVING_FRAMEWORK_TYPE
  system_type_detail: MLC_MLPERF_SYSTEM_TYPE_DETAIL
  redfish_endpoint: MLC_REDFISH_ENDPOINT
  redfish_username: MLC_REDFISH_USERNAME
  redfish_password: MLC_REDFISH_PASSWORD
default_env:
  MLC_MLPERF_SERVING_LOG_PATH: /tmp/serving.log

# Dependencies
deps:
- tags: detect,os
- names:
  - python
  - python3
  tags: get,python
prehook_deps:
- tags: get,mlperf,single-node,system-info
  names:
  - mlperf-single-node-system-info
  skip_if_env:
    MLC_EXCLUDE_CURRENT_NODE:
    - 'True'
  env:
    MLC_SINGLE_NODE_SYSTEM_INFO_DIR_PATH: <<<MLC_MULTI_NODE_SYSTEM_INFO_DIR_PATH>>>
    MLC_SINGLE_NODE_SYSTEM_INFO_FILE_NAME: mlperf-system-info-single-node-0.json
  # Two mutually exclusive get-redfish-power-info invocations, selected by
  # whether _inference_optional_nameplate is also active. Only one of these
  # two ever runs: _redfish + _inference_optional_nameplate together use the
  # lean scope (PSU-only walk, no Thermal/Systems); _redfish alone uses the
  # full general-purpose capture. If _inference_optional_nameplate is set
  # WITHOUT _redfish, neither of these deps runs at all -- postprocess()
  # writes the generic skeleton template instead (no BMC contact).
- tags: get,redfish,power,info,_inference_optional_nameplate
  names:
  - get-redfish-power-info
  enable_if_env:
    MLC_MLPERF_REDFISH_ENABLED:
    - 'True'
    MLC_MLPERF_INFERENCE_OPTIONAL_NAMEPLATE_ENABLED:
    - 'True'
  env:
    # MLC_REDFISH_ENDPOINT/USERNAME/PASSWORD are NOT re-templated here: the
    # template engine can't resolve <<<X>>> when the destination key is the
    # same name as the source (self-referential templates resolve to a
    # literal string, not the value) -- these pass through via ordinary env
    # inheritance instead, since both scripts use the identical var names.
    MLC_REDFISH_NAMEPLATE_OUTPUT_FILE: <<<MLC_MULTI_NODE_SYSTEM_INFO_DIR_PATH>>>/redfish_nameplate_power.yaml
    MLC_REDFISH_SYSTEM_NAME: <<<MLC_MLPERF_SYSTEM_NAME>>>
- tags: get,redfish,power,info,_full
  names:
  - get-redfish-power-info
  enable_if_env:
    MLC_MLPERF_REDFISH_ENABLED:
    - 'True'
  skip_if_env:
    MLC_MLPERF_INFERENCE_OPTIONAL_NAMEPLATE_ENABLED:
    - 'True'
  env:
    # See note above: MLC_REDFISH_ENDPOINT/USERNAME/PASSWORD pass through via
    # ordinary env inheritance, not self-referential templates.
    MLC_REDFISH_OUTPUT_FILE: <<<MLC_MULTI_NODE_SYSTEM_INFO_DIR_PATH>>>/redfish_capture.yaml

# Runs after postprocess(), so every node's sysinfo JSON and its lstopo XML are
# already sitting in MLC_MULTI_NODE_SYSTEM_INFO_DIR_PATH by the time the graph
# is built. generate-infograph discovers the per-node pairs in that directory
# itself rather than being handed a node list, so the two scripts never have to
# agree on node numbering.
post_deps:
- tags: generate,infograph
  names:
  - generate-infograph
  enable_if_env:
    MLC_MLPERF_INFRAGRAPH_ENABLED:
    - 'True'
  env:
    MLC_INFRAGRAPH_INPUT_DIR_PATH: <<<MLC_MULTI_NODE_SYSTEM_INFO_DIR_PATH>>>
    MLC_INFRAGRAPH_NAME: <<<MLC_MLPERF_SYSTEM_NAME>>>

# Variations
variations:
  cuda:
    group: accelerator-backend
    adr:
      mlperf-single-node-system-info:
        tags: _cuda
    env:
      MLC_ACCELERATOR_BACKEND: cuda
  rocm:
    group: accelerator-backend
    adr:
      mlperf-single-node-system-info:
        tags: _rocm
    env:
      MLC_ACCELERATOR_BACKEND: rocm
  xpu:
    group: accelerator-backend
    adr:
      mlperf-single-node-system-info:
        tags: _xpu
    env:
      MLC_ACCELERATOR_BACKEND: xpu
  exclude_current_node:
    env:
      MLC_EXCLUDE_CURRENT_NODE: 'True'
  inference:
    group: mlperf-benchmark
    env:
      MLC_MLPERF_BENCHMARK: inference
  endpoints:
    group: mlperf-benchmark
    env:
      MLC_MLPERF_BENCHMARK: endpoints
  network:
    env:
      MLC_MLPERF_NETWORK_VARIATION: 'True'
  power:
    env:
      MLC_MLPERF_POWER_VARIATION: 'True'
  redfish:
    env:
      MLC_MLPERF_REDFISH_ENABLED: 'True'
  inference_optional_nameplate:
    env:
      MLC_MLPERF_INFERENCE_OPTIONAL_NAMEPLATE_ENABLED: 'True'
  # Capture an hwloc topology per node alongside the sysinfo, then build the
  # infrastructure graph from the whole set once every node has reported in.
  # MLC_COLLECT_LSTOPO_TOPOLOGY is inherited by the local single-node dep; the
  # remote nodes get it as an explicit _lstopo tag in preprocess().
  infragraph:
    env:
      MLC_MLPERF_INFRAGRAPH_ENABLED: 'True'
      MLC_COLLECT_LSTOPO_TOPOLOGY: 'True'
  # Skip the HTML visualizer bundle; the graph JSON/YAML is still produced.
  no_visualize:
    env:
      MLC_INFRAGRAPH_SKIP_VISUALIZE: 'True'

# Output / debugging
print_env_at_the_end:
  MLC_INFRAGRAPH_FILE_PATH: Path to the annotated infrastructure graph JSON (with _infragraph).
  MLC_INFRAGRAPH_YAML_FILE_PATH: Path to the merged infrastructure graph YAML (with _infragraph).
  MLC_INFRAGRAPH_VISUALS_DIR_PATH: Directory holding the generated infragraph visualizer files.
  MLC_MULTI_NODE_SYSTEM_INFO_FILE_PATH: Path to the generated multi-node system info file.
  MLC_NAMEPLATE_POWER_YAML_FILE_PATH: Path to the generated nameplate power YAML file (populated from Redfish with _redfish,_inference_optional_nameplate; a generic skeleton template with _inference_optional_nameplate alone).
