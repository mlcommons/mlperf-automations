alias: get-ml-model-yolov11
uid: b83c7b589d274002
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
tags:
- get-ml-model-yolov11

# Cache
cache: true

# Environment
new_env_keys:
- MLC_ML_MODEL_YOLOV11_PATH
- MLC_ML_MODEL_FILE_WITH_PATH

# Input mapping
input_mapping:
  download_parallelism: MLC_DOWNLOAD_PARALLELISM
  r2_client_id: CF_ACCESS_CLIENT_ID
  r2_client_secret: CF_ACCESS_CLIENT_SECRET
  use_service_account: MLC_AUTH_USING_SERVICE_ACCOUNT
input_description:
  download_parallelism:
    desc: Number of files the MLCommons R2 downloader fetches concurrently. Only used with the r2-downloader download tool; when unset the downloader picks the value itself based on the number of files.
  r2_client_id:
    desc: Cloudflare Access service-account client ID. Sets CF_ACCESS_CLIENT_ID for the r2-downloader; only used together with --use_service_account. Prefer exporting the variable instead of passing it on the command line.
  r2_client_secret:
    desc: Cloudflare Access service-account client secret. Sets CF_ACCESS_CLIENT_SECRET for the r2-downloader; only used together with --use_service_account. Prefer exporting the variable instead of passing it on the command line.
  use_service_account:
    desc: Authenticate with Cloudflare Access using service-account credentials (CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET) instead of an interactive browser login. Only used with the r2-downloader download tool; required to reach gated buckets on headless machines and in CI.

# Variations
variations:
  mlc:
    default: true
    env:
      MLC_DOWNLOAD_SRC: mlcommons
    group: download-src
    prehook_deps:
    - enable_if_env:
        MLC_TMP_REQUIRE_DOWNLOAD:
        - 'yes'
      env:
        MLC_DOWNLOAD_FILENAME: yolov11-checkpoint
        MLC_DOWNLOAD_FINAL_ENV_NAME: MLC_ML_MODEL_YOLOV11_PATH
        MLC_EXTRACT_FINAL_ENV_NAME: MLC_ML_MODEL_YOLOV11_PATH
      extra_cache_tags: ml,model,yolov11
      force_cache: true
      force_env_keys:
      - MLC_OUTDIRNAME
      names:
      - yolov11-model-dae
      tags: download-and-extract
      update_tags_from_env_with_prefix:
        _url.:
        - MLC_DOWNLOAD_URL
  dry-run:
    env:
      MLC_DOWNLOAD_MODE: dry
    group: run-mode
  dry-run,r2-downloader:
    env:
      MLC_DOWNLOAD_EXTRA_OPTIONS: -x
  r2-downloader:
    adr:
      yolov11-model-dae:
        env:
          MLC_DOWNLOAD_URL: https://yolo.mlcommons-storage.org/metadata/YOLO-model.uri
        tags: _r2-downloader
    default: true
  service-account:
    env:
      MLC_AUTH_USING_SERVICE_ACCOUNT: 'yes'

# Output / debugging
print_env_at_the_end:
  MLC_ML_MODEL_YOLOV11_PATH: YOLOv11 checkpoint path

# Tests
tests:
  needs_pat: true
  run_inputs:
  - variations_list:
    - r2-downloader,mlc,dry-run,service-account
