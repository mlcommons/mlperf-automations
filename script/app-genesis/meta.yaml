alias: app-genesis
uid: 7578d2b9ff7ccdf4
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application
tags:
- app
- genesis
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_GENESIS_SRC_PATH
- MLC_GENESIS_INSTALL_PATH
- MLC_GENESIS_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,generic-sys-util,_gfortran
- tags: get,generic-sys-util,_libopenmpi-dev
- tags: get,generic-sys-util,_libfftw3-dev
- tags: get,generic-sys-util,_liblapack-dev
- tags: get,generic-sys-util,_autoconf
- tags: get,generic-sys-util,_automake
- tags: get,generic-sys-util,_libtool
- tags: get,generic-sys-util,_m4
- tags: get,git,repo
  names:
  - genesis-repo
  extra_cache_tags: genesis,repo,genesis-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_GENESIS_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://github.com/genesis-release-r-ccs/genesis.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.2.1.6.1:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT_TAG: v2.1.6.1

# Tests
tests:
  run_inputs:
  - variations_list:
    - repo.official
