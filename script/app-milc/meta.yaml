alias: app-milc
uid: 3bc28041e8eacbb6
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application
tags:
- app
- milc
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_MILC_SRC_PATH
- MLC_MILC_INSTALL_PATH
- MLC_MILC_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,git,repo
  names:
  - milc-repo
  extra_cache_tags: milc,repo,milc-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_MILC_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://github.com/milc-qcd/milc_qcd.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.develop:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT: develop


  # ---- Compiler variations (CC/CXX/FC + MPI wrappers via get-compiler-paths-amd) ----
  gcc:
    group: compiler
    env:
      MLC_COMPILER_FAMILY: gcc
    deps:
    - tags: get,compiler,paths,amd
      names:
      - compiler-paths
  aocc:
    group: compiler
    env:
      MLC_COMPILER_FAMILY: aocc
    deps:
    - tags: get,compiler,paths,amd
      names:
      - compiler-paths
  llvm:
    group: compiler
    env:
      MLC_COMPILER_FAMILY: llvm
    deps:
    - tags: get,compiler,paths,amd
      names:
      - compiler-paths
  amdclang:
    group: compiler
    env:
      MLC_COMPILER_FAMILY: amdclang
    deps:
    - tags: get,compiler,paths,amd
      names:
      - compiler-paths
  oneapi:
    group: compiler
    env:
      MLC_COMPILER_FAMILY: oneapi
    deps:
    - tags: get,compiler,paths,amd
      names:
      - compiler-paths

# Tests
tests:
  run_inputs:
  - variations_list:
    - repo.official
