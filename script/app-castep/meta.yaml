alias: app-castep
uid: a4407cee1bb90378
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application
tags:
- app
- castep
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_CASTEP_SRC_PATH
- MLC_CASTEP_INSTALL_PATH
- MLC_CASTEP_BIN_PATH
- +PATH
new_state_keys: []

# Input mapping (proprietary: user supplies the source/install tree)
input_mapping:
  src: MLC_CASTEP_SRC_PATH
input_description:
  src:
    desc: Path to a licensed CASTEP source or install tree

# Dependencies
deps:
- tags: detect,cpu
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations: {}

# Tests
# Empty: CASTEP is proprietary and cannot be fetched/built automatically.
tests:
  run_inputs: []
