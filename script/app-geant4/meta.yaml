alias: app-geant4
uid: 8c208061e882bff5
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application

tags:
- app
- geant4
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_GEANT4_SRC_PATH
- MLC_GEANT4_INSTALL_PATH
- MLC_GEANT4_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,generic-sys-util,_cmake
- tags: get,generic-sys-util,_libexpat1-dev
- tags: get,generic-sys-util,_zlib1g-dev
- tags: get,git,repo
  names:
  - geant4-repo
  extra_cache_tags: geant4,repo,geant4-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_GEANT4_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://github.com/Geant4/geant4.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.11.2.2:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT_TAG: v11.2.2

# Tests
tests:
  run_inputs:
  - variations_list:
    - repo.official
