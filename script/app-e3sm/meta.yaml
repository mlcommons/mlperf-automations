alias: app-e3sm
uid: 7768813e07e30462
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application
tags:
- app
- e3sm
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_E3SM_SRC_PATH
- MLC_E3SM_INSTALL_PATH
- MLC_E3SM_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,generic-sys-util,_gfortran
- tags: get,generic-sys-util,_libopenmpi-dev
- tags: get,git,repo
  names:
  - e3sm-repo
  extra_cache_tags: e3sm,repo,e3sm-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_E3SM_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://github.com/E3SM-Project/E3SM.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.master:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT: master

# Tests
# Empty: heavy dependency stack / long build; recipe provided in run.sh
# but not enabled in CI. Validate and enable once confirmed.
tests:
  run_inputs: []
