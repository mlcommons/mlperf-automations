alias: app-smilei
uid: 2fe9b0dd4f57b29f
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application

tags:
- app
- smilei
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_SMILEI_SRC_PATH
- MLC_SMILEI_INSTALL_PATH
- MLC_SMILEI_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,generic-sys-util,_libhdf5-openmpi-dev
- tags: get,generic-sys-util,_python3-dev
- tags: get,generic-sys-util,_python3-numpy
- tags: get,python3
  names:
  - python
  - python3
- tags: get,git,repo
  names:
  - smilei-repo
  extra_cache_tags: smilei,repo,smilei-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_SMILEI_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://github.com/SmileiPIC/Smilei.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.5.1:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT_TAG: v5.1


  # ---- Compiler variations (CC/CXX/FC + MPI wrappers via get-compiler-paths-amd) ----
  gcc:
    group: compiler
    env:
      MLC_COMPILER_FAMILY: gcc
    deps:
    - tags: get,compiler,paths,amd
      names:
      - compiler-paths
  aocc:
    group: compiler
    env:
      MLC_COMPILER_FAMILY: aocc
    deps:
    - tags: get,compiler,paths,amd
      names:
      - compiler-paths
  llvm:
    group: compiler
    env:
      MLC_COMPILER_FAMILY: llvm
    deps:
    - tags: get,compiler,paths,amd
      names:
      - compiler-paths
  amdclang:
    group: compiler
    env:
      MLC_COMPILER_FAMILY: amdclang
    deps:
    - tags: get,compiler,paths,amd
      names:
      - compiler-paths
  oneapi:
    group: compiler
    env:
      MLC_COMPILER_FAMILY: oneapi
    deps:
    - tags: get,compiler,paths,amd
      names:
      - compiler-paths

# Tests
tests:
  run_inputs:
  - variations_list:
    - repo.official
