alias: app-fleur
uid: 5e8c912d55b3fa8d
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application
tags:
- app
- fleur
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_FLEUR_SRC_PATH
- MLC_FLEUR_INSTALL_PATH
- MLC_FLEUR_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,cmake
- tags: get,generic-sys-util,_gfortran
- tags: get,generic-sys-util,_libopenmpi-dev
- tags: get,generic-sys-util,_liblapack-dev
- tags: get,generic-sys-util,_libxml2-dev
- tags: get,generic-sys-util,_libhdf5-dev
- tags: get,generic-sys-util,_libfftw3-dev
- tags: get,git,repo
  names:
  - fleur-repo
  extra_cache_tags: fleur,repo,fleur-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_FLEUR_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://iffgit.fz-juelich.de/fleur/fleur.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.develop:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT: develop

# Tests
tests:
  run_inputs:
  - variations_list:
    - repo.official
