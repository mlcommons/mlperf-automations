alias: get-ml-model-pointpillars
uid: 3562621a8994411d
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
tags:
- get
- ml-model
- ml
- model
- pointpainting

# Cache
cache: true

# Environment
new_env_keys:
- MLC_ML_MODEL_POINT_PAINTING_PATH
- MLC_ML_MODEL_DPLAB_RESNET50_PATH

# Input mapping
input_mapping:
  dp_resnet50_path: MLC_ML_MODEL_DPLAB_RESNET50_PATH
  pp_path: MLC_ML_MODEL_POINT_PAINTING_PATH
  r2_client_id: CF_ACCESS_CLIENT_ID
  r2_client_secret: CF_ACCESS_CLIENT_SECRET
  use_service_account: MLC_AUTH_USING_SERVICE_ACCOUNT
input_description:
  r2_client_id:
    desc: Cloudflare Access service-account client ID. Sets CF_ACCESS_CLIENT_ID for the r2-downloader; only used together with --use_service_account. Prefer exporting the variable instead of passing it on the command line.
  r2_client_secret:
    desc: Cloudflare Access service-account client secret. Sets CF_ACCESS_CLIENT_SECRET for the r2-downloader; only used together with --use_service_account. Prefer exporting the variable instead of passing it on the command line.
  use_service_account:
    desc: Authenticate with Cloudflare Access using service-account credentials (CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET) instead of an interactive browser login. Only used with the r2-downloader download tool; required to reach gated buckets on headless machines and in CI.

# Variations
variations:
  cpu:
    group: device
    env:
      MLC_ML_MODEL_PP_FORMAT: onnx
      MLC_ML_MODEL_DPLAB_RESNET50_FORMAT: onnx
  gpu:
    default: true
    group: device
    env:
      MLC_ML_MODEL_PP_FORMAT: pth
      MLC_ML_MODEL_DPLAB_RESNET50_FORMAT: pth
  mlc:
    group: download-src
    default: true
    prehook_deps:
    - enable_if_env:
        MLC_TMP_REQUIRE_DOWNLOAD:
        - 'yes'
      env:
        MLC_DOWNLOAD_FINAL_ENV_NAME: MLC_ML_MODEL_POINT_PAINTING_TMP_PATH
        MLC_EXTRACT_FINAL_ENV_NAME: MLC_ML_MODEL_POINT_PAINTING_TMP_PATH
      extra_cache_tags: waymo,dataset
      force_cache: true
      names:
      - dae
      tags: download-and-extract
      force_env_keys:
      - MLC_OUTDIRNAME
      update_tags_from_env_with_prefix:
        _url.:
        - MLC_DOWNLOAD_URL
    env:
      MLC_DOWNLOAD_SRC: mlcommons
  r2-downloader:
    group: download-tool
    add_deps_recursive:
      dae:
        tags: _r2-downloader
    default: true
  dry-run:
    group: run-mode
    env:
      MLC_DOWNLOAD_MODE: dry
  dry-run,r2-downloader:
    env:
      MLC_DOWNLOAD_EXTRA_OPTIONS: -x
  r2-downloader,mlc:
    env:
      MLC_DOWNLOAD_URL: https://waymo.mlcommons-storage.org/metadata/model.uri
      MLC_DOWNLOAD_FILENAME: model
  service-account:
    env:
      MLC_AUTH_USING_SERVICE_ACCOUNT: 'yes'

# Tests
tests:
  needs_pat: true
  run_inputs:
  - variations_list:
    - r2-downloader,mlc,dry-run,service-account
