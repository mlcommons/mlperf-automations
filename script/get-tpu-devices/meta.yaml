alias: get-tpu-devices
uid: 35dc27cbcd6a4bd0
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: TPU automation
tags:
- get
- tpu-devices

# Cache
cache: false
can_force_cache: true
clean_files:
- tmp-run.out

# Environment
new_env_keys:
- MLC_TPU_*
new_state_keys:
- mlc_tpu_device_prop
- mlc_tpu_devices_prop
- mlc_tpu_num_devices

# Input mapping
input_mapping:
  jax_probe_timeout: MLC_TPU_JAX_PROBE_TIMEOUT
  skip_jax_probe: MLC_TPU_SKIP_JAX_PROBE

# Dependencies
deps:
- tags: get,python
  names:
  - python
  - python3

# Output / debugging
print_files_if_script_error:
- tmp-run.out
