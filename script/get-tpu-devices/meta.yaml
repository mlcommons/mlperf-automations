alias: get-tpu-devices
uid: 34b0fbff00454048
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: TPU automation
tags:
- get
- tpu-devices

# Cache
cache: false
can_force_cache: true
cache_expiration: 1d
clean_files:
- tmp-run.out

# Environment
new_env_keys:
- MLC_TPU_*
new_state_keys:
- mlc_tpu_device_prop
- mlc_tpu_devices_prop
- mlc_tpu_num_devices

# Dependencies
deps:
- tags: get,python
  names:
  - python
  - python3

# Output / debugging
print_files_if_script_error:
- tmp-run.out
