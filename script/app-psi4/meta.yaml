alias: app-psi4
uid: 0a11246891a6aca8
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application
tags:
- app
- psi4
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_PSI4_SRC_PATH
- MLC_PSI4_INSTALL_PATH
- MLC_PSI4_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,cmake
- tags: get,generic-sys-util,_gfortran
- tags: get,generic-sys-util,_libopenblas-dev
- tags: get,generic-sys-util,_libeigen3-dev
- tags: get,generic-sys-util,_pkg-config
- tags: get,generic-sys-util,_python3-dev
- tags: get,generic-sys-util,_python3-venv
- tags: get,python3
  names:
  - python
  - python3
- tags: get,git,repo
  names:
  - psi4-repo
  extra_cache_tags: psi4,repo,psi4-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_PSI4_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://github.com/psi4/psi4.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.1.9.1:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT_TAG: v1.9.1

# Tests
tests:
  run_inputs:
  - variations_list:
    - repo.official
