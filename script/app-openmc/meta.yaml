alias: app-openmc
uid: 7ca4133e51873b56
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: HPC Application

tags:
- app
- openmc
- hpc

# Cache
cache: true

# Environment
default_env: {}
new_env_keys:
- MLC_OPENMC_SRC_PATH
- MLC_OPENMC_INSTALL_PATH
- MLC_OPENMC_BIN_PATH
- +PATH
new_state_keys: []

# Dependencies
deps:
- tags: detect,cpu
- env:
    MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE: true
  tags: get,generic-sys-util,_build-essential
- tags: get,generic-sys-util,_cmake
- tags: get,generic-sys-util,_libhdf5-dev
- tags: get,generic-sys-util,_libpng-dev
- tags: get,git,repo
  names:
  - openmc-repo
  extra_cache_tags: openmc,repo,openmc-repo
  env:
    MLC_GIT_CHECKOUT_PATH_ENV_NAME: MLC_OPENMC_SRC_PATH
  force_env_keys:
  - MLC_GIT_*
  update_tags_from_env_with_prefix:
    _branch.:
    - MLC_GIT_CHECKOUT
    _repo.:
    - MLC_GIT_REPO_URL
    _tag.:
    - MLC_GIT_CHECKOUT_TAG
prehook_deps: []
posthook_deps: []
post_deps: []

# Variations
variations:
  repo.#:
    env:
      MLC_GIT_REPO_URL: '#'
    group: repo
  repo.official:
    default: true
    env:
      MLC_GIT_REPO_URL: https://github.com/openmc-dev/openmc.git
    group: repo
  tag.#:
    env:
      MLC_GIT_CHECKOUT_TAG: '#'
    group: version
  branch.#:
    env:
      MLC_GIT_CHECKOUT: '#'
    group: version
  version.0.15.0:
    default: true
    group: version
    env:
      MLC_GIT_CHECKOUT_TAG: v0.15.0

# Tests
tests:
  run_inputs:
  - variations_list:
    - repo.official
