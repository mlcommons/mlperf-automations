alias: get-dataset-waymo
uid: 21b269c753b64437
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
tags:
- get
- dataset
- waymo

# Cache
cache: true

# Environment
new_env_keys:
- MLC_DATASET_WAYMO_PATH

# Input mapping
input_mapping:
  r2_client_id: CF_ACCESS_CLIENT_ID
  r2_client_secret: CF_ACCESS_CLIENT_SECRET
  use_service_account: MLC_AUTH_USING_SERVICE_ACCOUNT
  waymo_path: MLC_DATASET_WAYMO_PATH
input_description:
  r2_client_id:
    desc: Cloudflare Access service-account client ID. Sets CF_ACCESS_CLIENT_ID for the r2-downloader; only used together with --use_service_account. Prefer exporting the variable instead of passing it on the command line.
  r2_client_secret:
    desc: Cloudflare Access service-account client secret. Sets CF_ACCESS_CLIENT_SECRET for the r2-downloader; only used together with --use_service_account. Prefer exporting the variable instead of passing it on the command line.
  use_service_account:
    desc: Authenticate with Cloudflare Access using service-account credentials (CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET) instead of an interactive browser login. Only used with the r2-downloader download tool; required to reach gated buckets on headless machines and in CI.

# Variations
variations:
  kitti_format:
    default: true
    group: dataset-format
    env:
      MLC_DATASET_WAYMO_FORMAT: kitti
  mlc:
    group: download-src
    default: true
    prehook_deps:
    - enable_if_env:
        MLC_TMP_REQUIRE_DOWNLOAD:
        - 'yes'
      env:
        MLC_DOWNLOAD_FINAL_ENV_NAME: MLC_DATASET_WAYMO_PATH
        MLC_EXTRACT_FINAL_ENV_NAME: MLC_DATASET_WAYMO_PATH
      extra_cache_tags: waymo,dataset
      force_cache: true
      names:
      - dae
      tags: download-and-extract
      force_env_keys:
      - MLC_OUTDIRNAME
      update_tags_from_env_with_prefix:
        _url.:
        - MLC_DOWNLOAD_URL
    env:
      MLC_DOWNLOAD_SRC: mlcommons
  r2-downloader:
    group: download-tool
    add_deps_recursive:
      dae:
        tags: _r2-downloader
    default: true
  rclone:
    group: download-tool
    add_deps_recursive:
      dae:
        tags: _rclone
    prehook_deps:
    - tags: get,rclone
      enable_if_env:
        MLC_TMP_REQUIRE_DOWNLOAD:
        - true
    - tags: get,rclone-config,_waymo
      force_cache: true
      enable_if_env:
        MLC_TMP_REQUIRE_DOWNLOAD:
        - true
  dry-run:
    group: run-mode
    env:
      MLC_DOWNLOAD_MODE: dry
  dry-run,r2-downloader:
    env:
      MLC_DOWNLOAD_EXTRA_OPTIONS: -x
  dry-run,rclone:
    env:
      MLC_DOWNLOAD_EXTRA_OPTIONS: --dry-run
  r2-downloader,mlc:
    env:
      MLC_DOWNLOAD_URL: https://waymo.mlcommons-storage.org/metadata/dataset.uri
      MLC_DOWNLOAD_FILENAME: dataset
  rclone,mlc:
    env:
      MLC_DOWNLOAD_URL: mlc_waymo:waymo_preprocessed_dataset/kitti_format
  service-account:
    env:
      MLC_AUTH_USING_SERVICE_ACCOUNT: 'yes'

# Tests
tests:
  needs_pat: true
  run_inputs:
  - variations_list:
    - r2-downloader,mlc,dry-run,service-account
    - rclone,mlc,dry-run
