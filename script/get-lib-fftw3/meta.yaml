alias: get-lib-fftw3
uid: e10774e0f748489e
automation_alias: script
automation_uid: 5b4e0237da074764

category: Detection or installation of tools and artifacts
tags:
- get
- lib
- fftw3

cache: false

default_env:
  MLC_FFTW3_FORCE_SYSTEM: 'no'
new_env_keys:
- MLC_FFTW3_*
- MLC_AOCL_FFTW_*
- FFTW_ROOT
- FFTW_HOME
- +LD_LIBRARY_PATH
- +LIBRARY_PATH
- +C_INCLUDE_PATH
- +CPLUS_INCLUDE_PATH
- +PKG_CONFIG_PATH
- +CMAKE_PREFIX_PATH

# AOCL-FFTW on x86_64; the distro FFTW elsewhere or with _system.
deps:
- tags: detect,os
- tags: get,lib,aocl-fftw
  names:
  - aocl-fftw
  enable_if_env:
    MLC_HOST_PLATFORM_FLAVOR:
    - x86_64
    MLC_FFTW3_FORCE_SYSTEM:
    - 'no'
- tags: get,generic,sys-util,_libfftw3-dev
  names:
  - system-fftw3
  skip_if_env:
    MLC_HOST_PLATFORM_FLAVOR:
    - x86_64
    MLC_FFTW3_FORCE_SYSTEM:
    - 'no'

variations:
  system:
    env:
      MLC_FFTW3_FORCE_SYSTEM: 'yes'
