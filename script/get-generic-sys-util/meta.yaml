# Tests
tests:
  run_inputs:
  - docker: 'yes'
    docker_os: rhel
    docker_os_version: '9'
    env:
      MLC_TMP_FAIL_SAFE: 'yes'
    ignore_missing: 'yes'
    test-all-variations: 'yes'
  - docker: 'yes'
    docker_os: ubuntu
    docker_os_version: '20.04'
    fail_safe: 'yes'
    ignore_missing: 'yes'
    test-all-variations: 'yes'
  - docker: 'yes'
    docker_os: ubuntu
    docker_os_version: '22.04'
    fail_safe: 'yes'
    ignore_missing: 'yes'
    test-all-variations: 'yes'
    docker_prune: 'yes'
  - docker: 'yes'
    docker_os: ubuntu
    docker_os_version: '24.04'
    fail_safe: 'yes'
    ignore_missing: 'yes'
    test-all-variations: 'yes'
    docker_prune: 'yes'
