alias: get-generic-sys-util
uid: bb0393afa8404a11
automation_alias: script
automation_uid: 5b4e0237da074764

# Metadata
category: Detection or installation of tools and artifacts
tags:
- get
- sys-util
- generic
- generic-sys-util

# Cache
cache: true

# Environment
default_env:
  MLC_CLEAN_DIRS: bin
  MLC_SUDO: sudo
env:
  MLC_GENERIC_SYS_UTIL_INSTALL_NEEDED: 'no'
  MLC_SYS_UTIL_VERSION_CMD: ''
new_env_keys:
- +PATH

# Input mapping
input_mapping:
  fail_safe: MLC_TMP_FAIL_SAFE
  ignore_missing: MLC_GENERIC_SYS_UTIL_IGNORE_MISSING_PACKAGE

# Dependencies
deps:
- tags: detect,os
- tags: detect,sudo

# Variations
variations:
  detect:
    default: true
    env:
      MLC_GENERIC_SYS_UTIL_RUN_MODE: detect
    group: mode
    prehook_deps:
    - enable_if_env:
        MLC_GENERIC_SYS_UTIL_INSTALL_NEEDED:
        - 'yes'
      force_env_keys:
      - MLC_TMP_FAIL_SAFE
      inherit_variation_tags: true
      names:
      - install-sys-util
      skip_inherit_variation_groups:
      - mode
      tags: get,generic-sys-util,_install
  install:
    env:
      MLC_GENERIC_SYS_UTIL_RUN_MODE: install
    group: mode
    new_env_keys:
    - MLC_TMP_GENERIC_SYS_UTIL_PACKAGE_INSTALL_IGNORED
    - MLC_GET_GENERIC_SYS_UTIL_INSTALL_FAILED
  autoconf:
    env:
      MLC_SYS_UTIL_NAME: autoconf
      MLC_SYS_UTIL_VERSION_CMD: autoconf --version
      MLC_SYS_UTIL_VERSION_RE: autoconf \(.*\) ([\d.]+)
      MLC_TMP_VERSION_DETECT_GROUP_NUMBER: 1
    new_env_keys:
    - MLC_AUTOCONF_VERSION
    state:
      autoconf:
        apt: autoconf
        brew: autoconf
        dnf: autoconf
        yum: autoconf
        zypper: autoconf
        pacman: autoconf
  build-essential:
    env:
      MLC_SYS_UTIL_NAME: build-essential
      MLC_SYS_UTIL_VERSION_CMD: make --version
      MLC_SYS_UTIL_VERSION_RE: GNU Make ([\d.]+)
      MLC_TMP_VERSION_DETECT_GROUP_NUMBER: 1
    new_env_keys:
    - MLC_MAKE_VERSION
    state:
      build-essential:
        apt: build-essential
        dnf: gcc gcc-c++ make
        yum: gcc gcc-c++ make
        zypper: gcc gcc-c++ make
        pacman: base-devel
  bzip2:
    env:
      MLC_SYS_UTIL_NAME: bzip2
      MLC_SYS_UTIL_VERSION_CMD_OVERRIDE: bzcat --version 2>&1 | grep bzip > tmp-ver.out
      MLC_SYS_UTIL_VERSION_RE: ([0-9]+(\.[0-9]+)+)
      MLC_TMP_VERSION_DETECT_GROUP_NUMBER: 1
    new_env_keys:
